      <rect x="14" y="132" width="32" height="26" rx="5"/><rect x="54" y="132" width="32" height="26" rx="5"/><rect x="94" y="132" width="32" height="26" rx="5"/><rect x="134" y="132" width="32" height="26" rx="5"/><rect x="174" y="132" width="32" height="26" rx="5"/><rect x="214" y="132" width="32" height="26" rx="5"/><rect x="254" y="132" width="32" height="26" rx="5"/>
      <rect x="14" y="168" width="32" height="26" rx="5"/><rect x="54" y="168" width="32" height="26" rx="5"/><rect x="94" y="168" width="32" height="26" rx="5"/><rect x="134" y="168" width="32" height="26" rx="5"/><rect x="174" y="168" width="32" height="26" rx="5"/><rect x="214" y="168" width="32" height="26" rx="5"/><rect x="254" y="168" width="32" height="26" rx="5"/>
      <rect x="14" y="204" width="32" height="26" rx="5"/><rect x="54" y="204" width="32" height="26" rx="5"/><rect x="94" y="204" width="32" height="26" rx="5"/><rect x="134" y="204" width="32" height="26" rx="5"/><rect x="174" y="204" width="32" height="26" rx="5"/><rect x="214" y="204" width="32" height="26" rx="5"/><rect x="254" y="204" width="32" height="26" rx="5"/>
