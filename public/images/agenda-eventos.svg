    <text x="150" y="35" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">OUTUBRO</text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#545b64" text-anchor="middle">
      <text x="30" y="82">D</text><text x="70" y="82">S</text><text x="110" y="82">T</text><text x="150" y="82">Q</text><text x="190" y="82">Q</text><text x="230" y="82">S</text><text x="270" y="82">S</text>
