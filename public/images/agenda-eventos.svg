<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="titulo-ilustracao">
  <title id="titulo-ilustracao">Calendário com datas de eventos marcadas em laranja</title>
  <rect width="480" height="360" rx="16" fill="#fdf6f2"/>
  <circle cx="400" cy="70" r="46" fill="#fbe9e1"/>
  <circle cx="70" cy="300" r="34" fill="#fbe9e1"/>

  <!-- Calendário -->
  <g transform="translate(90 58)">
